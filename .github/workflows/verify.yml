name: Verify public boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Bun for cross-runtime artifact testing
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - name: Install inertly
        run: npm ci --ignore-scripts
      - name: Verify commit authors
        run: npm run verify:authors -- "$AUTHOR_VERIFICATION_REF"
        env:
          AUTHOR_VERIFICATION_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify repository and package boundaries
        run: |
          npm run verify:scaffold
          npm run verify:package
