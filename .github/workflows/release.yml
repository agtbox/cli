name: Release npm package

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'agtbox-dev' && github.triggering_actor == 'agtbox-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node without a package cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Bun for cross-runtime artifact testing
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - name: Verify complete reachable commit authors
        run: npm run verify:authors -- "$GITHUB_SHA"
      - name: Verify the selected ref and npm OIDC support
        env:
          AGTBOX_RELEASE_REQUIRED_PUBLIC_ANCESTOR: ${{ vars.AGTBOX_RELEASE_REQUIRED_PUBLIC_ANCESTOR }}
          AGTBOX_RELEASE_TAG_SIGNING_ALLOWED_SIGNER: ${{ vars.AGTBOX_RELEASE_TAG_SIGNING_ALLOWED_SIGNER }}
        run: |
          node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF !== `refs/tags/v${p.version}`) { console.error("workflow must run on the exact package version tag"); process.exit(1) }'
          node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.AGTBOX_RELEASE_REQUIRED_PUBLIC_ANCESTOR || "")) { console.error("required public ancestor must be an exact commit ID"); process.exit(1) }'
          git cat-file -e "$AGTBOX_RELEASE_REQUIRED_PUBLIC_ANCESTOR^{commit}"
          release_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor "$AGTBOX_RELEASE_REQUIRED_PUBLIC_ANCESTOR" "$release_commit"
          test -n "$AGTBOX_RELEASE_TAG_SIGNING_ALLOWED_SIGNER"
          printf '%s\n' "$AGTBOX_RELEASE_TAG_SIGNING_ALLOWED_SIGNER" > "$RUNNER_TEMP/allowed-signers"
          git cat-file -e "$GITHUB_REF^{tag}"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed-signers" verify-tag "$GITHUB_REF"
          node -e 'const { execFileSync } = require("node:child_process"); const [major,minor,patch]=execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)'
      - name: Build and test the exact release artifact
        run: npm run release:artifact
      - name: Upload the reviewed artifact and manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-release-artifact
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.actor == 'agtbox-dev' && github.triggering_actor == 'agtbox-dev'
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release policy code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the exact build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: npm-release-artifact
          path: release-artifacts/
      - name: Publish through npm OIDC with provenance
        env:
          NPM_DIST_TAG: ${{ inputs.npm-tag }}
          NPM_TRUSTED_PUBLISHING_READY: ${{ vars.NPM_TRUSTED_PUBLISHING_READY }}
        run: node scripts/publish-artifact.mjs release-artifacts
