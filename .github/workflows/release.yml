name: Release npm package

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node without a package cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up Bun for cross-runtime artifact testing
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - name: Verify complete reachable commit authors
        run: npm run verify:authors -- "$GITHUB_SHA"
      - name: Verify the selected ref and npm OIDC support
        run: |
          node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF !== `refs/tags/v${p.version}`) { console.error("workflow must run on the exact package version tag"); process.exit(1) }'
          node -e 'const [major,minor,patch]=process.env.npm_config_user_agent.match(/npm\/(\d+)\.(\d+)\.(\d+)/).slice(1).map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)'
      - name: Build and test the exact release artifact
        run: npm run release:artifact
      - name: Upload the reviewed artifact and manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-release-artifact
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release policy code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the exact build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: npm-release-artifact
          path: release-artifacts/
      - name: Publish through npm OIDC with provenance
        env:
          NPM_DIST_TAG: ${{ inputs.npm-tag }}
          NPM_TRUSTED_PUBLISHING_READY: ${{ vars.NPM_TRUSTED_PUBLISHING_READY }}
        run: node scripts/publish-artifact.mjs release-artifacts
